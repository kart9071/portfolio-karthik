<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0e1116">
<title>Spend</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#8377;</text></svg>">
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --line:#262c36;
    --text:#e6e9ef; --dim:#9aa4b2; --accent:#4f8cff;
    --ok:#3fb950; --err:#f85149; --me:#4f8cff; --mom:#c47fff;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
    max-width:620px;margin:0 auto;
  }
  header{display:flex;align-items:baseline;justify-content:space-between;padding:22px 0 14px}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  .muted{color:var(--dim);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  textarea{
    width:100%;min-height:96px;resize:vertical;padding:13px;
    background:#0f131a;color:var(--text);border:1px solid var(--line);
    border-radius:10px;font:inherit;
  }
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  input[type=password],input[type=text]{
    width:100%;padding:13px;background:#0f131a;color:var(--text);
    border:1px solid var(--line);border-radius:10px;font:inherit;
  }
  .row{display:flex;gap:10px;margin-top:12px}
  button{
    flex:1;padding:14px;border:0;border-radius:10px;font:600 15px/1 inherit;
    background:var(--accent);color:#fff;cursor:pointer;min-height:48px;
  }
  button.ghost{background:#222835;color:var(--text);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}
  button:active{transform:translateY(1px)}
  .msg{margin-top:12px;padding:11px 13px;border-radius:10px;font-size:14px;display:none;white-space:pre-wrap;word-break:break-word}
  .msg.show{display:block}
  .msg.ok{background:rgba(63,185,80,.12);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
  .msg.err{background:rgba(248,81,73,.12);color:var(--err);border:1px solid rgba(248,81,73,.3)}
  .totals{display:flex;gap:10px;margin-bottom:12px}
  .tot{flex:1;background:#0f131a;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .tot .v{font-size:19px;font-weight:700;letter-spacing:-.02em}
  .tot .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
  .item{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .pill{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;flex-shrink:0}
  .pill.Me{background:rgba(79,140,255,.16);color:var(--me)}
  .pill.Mom{background:rgba(196,127,255,.16);color:var(--mom)}
  .item .body{flex:1;min-width:0}
  .item .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .s{font-size:12px;color:var(--dim)}
  .item .amt{font-weight:700;font-variant-numeric:tabular-nums}
  .bars{margin-top:4px}
  .bar{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:13px;padding:7px 0}
  .bar .track{grid-column:1/-1;height:5px;background:#0f131a;border-radius:3px;overflow:hidden}
  .bar .fill{height:100%;background:var(--accent);border-radius:3px}
  .seg{display:flex;gap:6px;margin-bottom:12px}
  .seg button{flex:1;padding:9px;font-size:13px;background:#0f131a;border:1px solid var(--line);color:var(--dim);min-height:0}
  .seg button[aria-pressed=true]{background:#222835;color:var(--text);border-color:var(--accent)}
  .hide{display:none}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:7px}
  @keyframes s{to{transform:rotate(360deg)}}
  footer{text-align:center;padding:10px 0 0}
  footer button{background:none;border:0;color:var(--dim);font-size:12px;text-decoration:underline;padding:6px;min-height:0}
</style>
</head>
<body>

<div id="gate" class="hide">
  <header><h1>Spend</h1></header>
  <div class="card">
    <p class="muted" style="margin:0 0 12px">Enter the access token to continue. It stays on this device.</p>
    <input type="password" id="tok" placeholder="Access token" autocomplete="current-password" enterkeyhint="go">
    <div class="row"><button id="unlock">Unlock</button></div>
    <div class="msg err" id="gateMsg"></div>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>Spend</h1>
    <span class="muted" id="today"></span>
  </header>

  <div class="card">
    <textarea id="prompt" placeholder="spent 250 on rice and dal by UPI yesterday, mom paid 1200 for the electricity bill" enterkeyhint="send"></textarea>
    <div class="row">
      <button id="add">Add expense</button>
      <button id="refresh" class="ghost">Show totals</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="summary">
    <div class="seg">
      <button data-range="month" aria-pressed="true">This month</button>
      <button data-range="all" aria-pressed="false">All time</button>
    </div>
    <div class="totals">
      <div class="tot"><div class="v" id="tTotal">—</div><div class="k">Total</div></div>
      <div class="tot"><div class="v" id="tMe" style="color:var(--me)">—</div><div class="k">Me</div></div>
      <div class="tot"><div class="v" id="tMom" style="color:var(--mom)">—</div><div class="k">Mom</div></div>
    </div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:6px">Recent</div>
    <div id="list"><div class="muted" style="padding:8px 0">Nothing yet.</div></div>
  </div>

  <footer><button id="forget">Forget token on this device</button></footer>
</div>

<script>
(function(){
  "use strict";
  // Same-origin in production (nginx proxies /api); localhost falls back to the
  // dev server's port so this page works unchanged in both places.
  var API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:8000"
    : "https://api.karthikshetty.co.in";

  var KEY = "spend.token";
  var $ = function(id){ return document.getElementById(id); };
  var token = "";
  var range = "month";

  try { token = localStorage.getItem(KEY) || ""; } catch (e) { token = ""; }

  function inr(n){
    return "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 0});
  }

  function say(el, text, kind){
    el.textContent = text;
    el.className = "msg show " + (kind || "");
  }
  function clear(el){ el.className = "msg"; }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({"X-Expense-Token": token}, opts.headers || {});
    return fetch(API + path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(body){
        if (!r.ok) {
          var e = new Error(body.detail || body.error || ("HTTP " + r.status));
          e.status = r.status;
          throw e;
        }
        return body;
      });
    });
  }

  function show(which){
    $("gate").className = which === "gate" ? "" : "hide";
    $("app").className  = which === "app"  ? "" : "hide";
  }

  // ---- gate
  function unlock(){
    var v = $("tok").value.trim();
    if (!v) return;
    token = v;
    $("unlock").disabled = true;
    api("/api/expenses").then(function(){
      try { localStorage.setItem(KEY, token); } catch (e) {}
      show("app");
      clear($("gateMsg"));
      load();
    }).catch(function(err){
      token = "";
      say($("gateMsg"), err.status === 401 ? "That token was not accepted." : err.message, "err");
    }).finally(function(){ $("unlock").disabled = false; });
  }
  $("unlock").addEventListener("click", unlock);
  $("tok").addEventListener("keydown", function(e){ if (e.key === "Enter") unlock(); });

  $("forget").addEventListener("click", function(){
    try { localStorage.removeItem(KEY); } catch (e) {}
    token = "";
    $("tok").value = "";
    show("gate");
  });

  // ---- add
  function add(){
    var text = $("prompt").value.trim();
    if (!text) { say($("msg"), "Type what you spent first.", "err"); return; }

    $("add").disabled = true;
    $("add").innerHTML = '<span class="spin"></span>Reading…';
    clear($("msg"));

    api("/api/expense", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({prompt: text})
    }).then(function(d){
      var lines = d.expenses.map(function(e){
        return e.person + " · " + e.category + " · " + inr(e.amount) + " · " + e.spent_on;
      });
      say($("msg"), "Added " + d.count + " — " + inr(d.total_added) + "\n" + lines.join("\n"), "ok");
      $("prompt").value = "";
      if (d.xlsx_updated === false) {
        say($("msg"), $("msg").textContent + "\n(sheet not updated: " + (d.xlsx_error || "unknown") + ")", "ok");
      }
      load();
    }).catch(function(err){
      if (err.status === 401) { show("gate"); return; }
      say($("msg"), err.message, "err");
    }).finally(function(){
      $("add").disabled = false;
      $("add").textContent = "Add expense";
    });
  }
  $("add").addEventListener("click", add);
  $("prompt").addEventListener("keydown", function(e){
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) add();
  });

  // ---- totals
  function load(){
    var q = "";
    if (range === "month") {
      var d = new Date();
      q = "?month=" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    $("refresh").disabled = true;
    api("/api/expenses" + q).then(function(d){
      $("tTotal").textContent = inr(d.total);
      $("tMe").textContent    = inr(d.by_person.Me);
      $("tMom").textContent   = inr(d.by_person.Mom);
      renderBars(d.by_category, d.total);
      renderList(d.expenses);
    }).catch(function(err){
      if (err.status === 401) { show("gate"); return; }
      say($("msg"), err.message, "err");
    }).finally(function(){ $("refresh").disabled = false; });
  }
  $("refresh").addEventListener("click", load);

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function(b){
    b.addEventListener("click", function(){
      range = b.dataset.range;
      Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function(o){
        o.setAttribute("aria-pressed", String(o === b));
      });
      load();
    });
  });

  function renderBars(cats, total){
    var entries = Object.keys(cats || {}).map(function(k){ return [k, cats[k]]; })
      .sort(function(a, b){ return b[1] - a[1]; }).slice(0, 6);
    if (!entries.length) { $("bars").innerHTML = ""; return; }
    $("bars").innerHTML = entries.map(function(e){
      var pct = total ? Math.round(e[1] / total * 100) : 0;
      return '<div class="bar"><span>' + esc(e[0]) + '</span><span class="muted">' + inr(e[1]) +
             '</span><div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
    }).join("");
  }

  function renderList(rows){
    if (!rows || !rows.length) {
      $("list").innerHTML = '<div class="muted" style="padding:8px 0">Nothing yet.</div>';
      return;
    }
    $("list").innerHTML = rows.slice(0, 12).map(function(r){
      var sub = r.spent_on + " · " + r.payment_mode;
      return '<div class="item">' +
        '<span class="pill ' + (r.person === "Mom" ? "Mom" : "Me") + '">' + esc(r.person) + '</span>' +
        '<div class="body"><div class="t">' + esc(r.item || r.category) + '</div>' +
        '<div class="s">' + esc(sub) + '</div></div>' +
        '<div class="amt">' + inr(r.amount) + '</div></div>';
    }).join("");
  }

  function esc(s){
    return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  $("today").textContent = new Date().toLocaleDateString("en-IN", {day:"numeric", month:"short"});

  // A stored token still has to be accepted by the server - it may have been
  // rotated since this device last used it.
  if (token) {
    api("/api/expenses").then(function(){ show("app"); load(); })
                        .catch(function(){ show("gate"); });
  } else {
    show("gate");
  }
})();
</script>
</body>
</html>

name: Build & Deploy Portfolio

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # One deploy at a time; never cancel a run that is mid-deploy.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- detect
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push)         base="$PUSH_BASE" ;;
            *)            base="" ;;
          esac

          # First push, force-push, or manual run: treat everything as changed.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ref - building everything."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$files"

          fe=false
          be=false
          echo "$files" | grep -q '^portfolio-app/'     && fe=true
          echo "$files" | grep -q '^portfolio-backend/' && be=true

          # A change to the pipeline itself re-validates both sides.
          if echo "$files" | grep -q '^\.github/workflows/'; then
            fe=true
            be=true
          fi

          echo "frontend=$fe" >> "$GITHUB_OUTPUT"
          echo "backend=$be"  >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- build
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio-app/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-app
        run: npm ci

      - name: Lint
        working-directory: portfolio-app
        run: npm run lint

      - name: Build
        working-directory: portfolio-app
        env:
          # Falls back to portfolio-app/.env.production when the repo variable is unset.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Verify the bundle points at the production API
        working-directory: portfolio-app
        env:
          EXPECTED_API: https://api.karthikshetty.co.in
        run: |
          set -euo pipefail

          # A build that misses .env.production silently falls back to the dev
          # default in Contact.jsx and posts to the visitor's own machine. That
          # shipped once already, so check positively rather than by exclusion.
          if ! grep -rqF "$EXPECTED_API" dist/assets/; then
            echo "::error::Bundle does not contain $EXPECTED_API - VITE_API_URL did not reach the build."
            exit 1
          fi

          # Anything plain-HTTP is either a dev fallback or mixed content on an
          # HTTPS page; both break the contact form in production.
          if grep -rqE 'http://(localhost|127\.0\.0\.1|[0-9]{1,3}\.[0-9]{1,3}\.)' dist/assets/; then
            echo "::error::Bundle contains a localhost or plain-HTTP API address."
            grep -rohE 'http://[a-zA-Z0-9.:_-]+' dist/assets/ | sort -u
            exit 1
          fi

          echo "Bundle targets $EXPECTED_API"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: portfolio-app/dist
          retention-days: 7

  check-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portfolio-backend/requirements.txt

      - name: Install dependencies
        working-directory: portfolio-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Smoke test the app under gunicorn
        working-directory: portfolio-backend
        run: |
          set -euo pipefail
          gunicorn -w 1 -b 127.0.0.1:8000 app:app --daemon --pid gunicorn.pid --log-file -

          ok=0
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 0.5
          done
          echo
          if [ "$ok" != "1" ]; then
            echo "::error::Backend never became healthy"
            exit 1
          fi

          curl -fsS -X POST http://127.0.0.1:8000/api/contact \
            -H 'Content-Type: application/json' \
            -d '{"name":"ci","email":"ci@example.com","message":"pipeline smoke test"}'
          echo

          kill "$(cat gunicorn.pid)"

  # ---------------------------------------------------------------- deploy
  deploy-frontend:
    needs: [changes, build-frontend]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload build to the web root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_ROOT: ${{ vars.FRONTEND_ROOT }}
        run: |
          set -euo pipefail
          case "${FRONTEND_ROOT:-}" in
            ""|"/"|"/home"|"/var"|"/var/www"|"/usr"|"/etc")
              echo "::error::FRONTEND_ROOT repo variable is unset or unsafe: '${FRONTEND_ROOT:-}'"
              exit 1
              ;;
          esac

          # Must already exist - refuse to invent a web root nginx is not serving.
          if ! ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "test -d '$FRONTEND_ROOT'"; then
            echo "::error::$FRONTEND_ROOT does not exist on the server. Match it to the root directive in /etc/nginx/sites-available/portfolio."
            exit 1
          fi

          # rsync must exist on BOTH ends. Without this, a missing server-side
          # rsync surfaces only as "connection unexpectedly closed / code 12".
          if ! ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null 2>&1"; then
            echo "::error::rsync is not installed on the server. Run: sudo apt update && sudo apt install -y rsync"
            exit 1
          fi

          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/id_deploy" \
            dist/ "$SSH_USER@$SSH_HOST:$FRONTEND_ROOT/"

      - name: Verify the site is up
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null -w 'site: %{http_code}\n' https://karthikshetty.co.in/

  deploy-backend:
    needs: [changes, check-backend]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Back up the contacts database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_DIR: ${{ vars.BACKEND_DIR }}
        run: |
          set -euo pipefail
          : "${BACKEND_DIR:?BACKEND_DIR repo variable is not set}"

          # Kept outside BACKEND_DIR so rsync --delete can never reach it.
          # \$ escapes run on the server, not on this runner.
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "set -e; \
             mkdir -p ~/portfolio-db-backups; \
             if [ -f '$BACKEND_DIR/contacts.db' ]; then \
               cp -p '$BACKEND_DIR/contacts.db' ~/portfolio-db-backups/contacts-\$(date +%Y%m%d-%H%M%S).db; \
             fi; \
             ls -1t ~/portfolio-db-backups/contacts-*.db 2>/dev/null | tail -n +21 | xargs -r rm -f; \
             ls -1t ~/portfolio-db-backups/ | head -3"

      - name: Sync code, install deps, restart service
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_DIR: ${{ vars.BACKEND_DIR }}
          VENV_DIR: ${{ vars.VENV_DIR }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'portfolio' }}
        run: |
          set -euo pipefail
          : "${BACKEND_DIR:?BACKEND_DIR repo variable is not set}"
          : "${VENV_DIR:?VENV_DIR repo variable is not set}"

          if ! ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "test -d '$BACKEND_DIR' && test -x '$VENV_DIR/bin/python'"; then
            echo "::error::BACKEND_DIR or VENV_DIR does not match the server layout."
            exit 1
          fi

          if ! ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null 2>&1"; then
            echo "::error::rsync is not installed on the server. Run: sudo apt update && sudo apt install -y rsync"
            exit 1
          fi

          # --delete keeps the deploy reproducible; the excludes protect live state.
          # venv/ sits INSIDE BACKEND_DIR on this server - without that exclude,
          # --delete would destroy the running service's interpreter.
          rsync -az --delete \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'contacts.db' \
            --exclude '*.db-journal' \
            --exclude '__pycache__/' \
            -e "ssh -i ~/.ssh/id_deploy" \
            portfolio-backend/ "$SSH_USER@$SSH_HOST:$BACKEND_DIR/"

          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" \
            "set -e; '$VENV_DIR/bin/pip' install --quiet --upgrade -r '$BACKEND_DIR/requirements.txt'; sudo systemctl restart '$SERVICE_NAME'; sudo systemctl is-active --quiet '$SERVICE_NAME'"

      - name: Verify the API is healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            if curl -fsS https://api.karthikshetty.co.in/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "::error::API did not come back healthy after the restart."
          exit 1
